<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" fill="none">
<style>
@media(prefers-reduced-motion:no-preference){
  .motion{animation:float 2.1s ease-in-out infinite alternate;transform-origin:center}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
  .tap-ripple{animation:pulse 1.9s ease-out infinite;transform-origin:184px 92px}
  @keyframes pulse{from{opacity:.7;transform:scale(.65)}to{opacity:0;transform:scale(1.1)}}
  .follow-frame{animation:follow 2.2s ease-in-out infinite alternate}
  @keyframes follow{from{transform:translateX(-13px)}to{transform:translateX(5px)}}
  .export-arrow{animation:out 1.6s ease-in-out infinite alternate}
  @keyframes out{from{transform:translateX(-6px);opacity:.5}to{transform:translateX(5px);opacity:1}}
}
</style>
