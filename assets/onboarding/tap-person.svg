<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" fill="none" role="img" aria-label="Tap a person on your phone">
<style>
@media (prefers-reduced-motion:no-preference){
 .ripple{animation:tapRipple 2s ease-out infinite;transform-origin:207px 87px}
 .finger{animation:touch 2s ease-in-out infinite;transform-origin:208px 121px}
 @keyframes tapRipple{0%,18%{transform:scale(.65);opacity:.8}68%,100%{transform:scale(1.3);opacity:0}}
 @keyframes touch{0%,100%{transform:translateY(7px)}38%,65%{transform:translateY(0)}}
}}
</style>
<defs><linearGradient id="frame" x1="83" y1="23" x2="238" y2="164" gradientUnits="userSpaceOnUse"><stop stop-color="#DBFF89"/><stop offset="1" stop-color="#9AE24D"/></linearGradient></defs>
<!-- The focus frame belongs to the image, not a drawing overlay. -->
<path d="M105 23H93q-12 0-12 12v17M214 23h12q12 0 12 12v17M81 139v14q0 12 12 12h12M238 139v14q0 12-12 12h-12" stroke="url(#frame)" stroke-width="4" stroke-linecap="round"/>
<!-- One simple torso silhouette, head and shoulders only. -->
<circle cx="152" cy="64" r="25" fill="#BBC8B9"/>
<path d="M110 151V117q0-18 18-26 10-5 24-5t24 5q18 8 18 26v34q-42 13-84 0Z" fill="#7F9082"/>
<path d="M122 116v19M182 116v19" stroke="#ACBCAA" stroke-width="1.7" stroke-linecap="round" opacity=".35"/>
<!-- A finger/hand touch icon, not a computer pointer. -->
<circle class="ripple" cx="207" cy="91" r="22" stroke="#B8F451" stroke-width="3"/>
<g class="finger">
<path d="M200 135 185 116q-4-6 0-10 5-4 9 0l8 9V86q0-8 7-8t7 8v21q3-6 9-4 4 1 5 6 6-5 11 1 5 5 4 17l-4 21q-2 11-13 14h-15q-11-2-17-13Z" fill="#E9F5E4" stroke="#B8F451" stroke-width="2.7" stroke-linejoin="round"/>
<path d="M216 111v11M230 113v12" stroke="#759B70" stroke-width="2" stroke-linecap="round"/>
</g>
</svg>
